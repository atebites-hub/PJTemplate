site_name: yourapp
site_description: Internal documentation for yourapp
site_url: http://localhost:8000

docs_dir: ../../docs
site_dir: ../../site/docs

# Task memories are local-only (gitignored) and not published documentation.
exclude_docs: |
  memories/

strict: true
use_directory_urls: true

theme:
  name: mkdocs

nav:
  - Home: index.md
  - Agent templates:
      - App flow: agents/app_flow_template.md
      - Client guidelines: agents/client_guidelines_template.md
      - Coding standards: agents/coding_standards_template.md
      - Documentation guidelines: agents/documentation_guidelines_template.md
      - File structure: agents/file_structure_template.md
      - Implementation plan: agents/implementation_plan_template.md
      - Project requirements: agents/project_requirements_template.md
      - Server structure: agents/server_structure_template.md
      - Technology stack: agents/technology_stack_template.md
      - Testing guidelines: agents/testing_guidelines_template.md
  - Process docs:
      - Enforcement matrix: agents/enforcement_matrix.md
      - Execution policy: agents/execution_policy.md
      - ODW executor matrix: agents/odw_executor_matrix.md
  - Test docs:
      - Dev notebooks: tests/notebooks.md
  - Code documentation:
      - server/config/constants: code/server/config/constants.md
      - server/config/settings: code/server/config/settings.md
      - server/runtime/main: code/server/runtime/main.md
      - server/logging/logging: code/server/logging/logging.md
      - server/logging/metrics: code/server/logging/metrics.md
      - server/logging/telemetry: code/server/logging/telemetry.md
      - server/logging/tracing: code/server/logging/tracing.md
      - client/scripts/main: code/client/scripts/main.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../../src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
