name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      # GitHub's Dependency Review action needs Dependency graph. That is off
      # (or GHAS-gated) on some public and private clones; the action then
      # fails the job with "not supported on this repository". Probe first so
      # this template stays green; lockfile gates in ci.yml still enforce.
      - name: Detect dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skip when Dependency graph is unavailable
        if: ${{ steps.graph.outputs.enabled != 'true' }}
        run: |
          echo "::notice title=Dependency Review skipped::GitHub Dependency Review needs Dependency graph (Settings → Code security). The other CI lockfile gates (pip-audit, OSV-Scanner, GuardDog, OpenGrep) remain enforced."
          cat <<'MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          ## Dependency Review skipped

          GitHub's Dependency Review action is unavailable because Dependency
          graph is not enabled on this repository (or GitHub Code Security/GHAS
          is required and not present). Enable it under
          **Settings → Code security** to turn this check on.

          This workflow is passing intentionally for that repository shape.
          Dependency security remains enforced by the main CI lockfile gates:
          `pip-audit`, OSV-Scanner, GuardDog, and OpenGrep.
          MARKDOWN

      - name: Checkout
        if: ${{ steps.graph.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: ${{ steps.graph.outputs.enabled == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
